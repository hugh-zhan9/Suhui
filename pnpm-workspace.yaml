packages:
  - apps/cli
  - apps/desktop
  - packages/**/*
  - apps/desktop/layer/*
  - "!**/example"
  - "!**/example/**"

catalog:
  "@follow-app/client-sdk": 0.3.92
  "@folo-services/ai-tools": 0.2.65
  tailwindcss-uikit-colors: 1.0.0
  typescript: 5.9.3

ignorePatchFailures: false

onlyBuiltDependencies:
  - "@tsslint/core"
  - "@tsslint/eslint"
  - better-sqlite3
  - bufferutil
  - core-js
  - dtrace-provider
  - electron
  - electron-winstaller
  - esbuild
  - fast-folder-size
  - fs-xattr
  - macos-alias
  - msedge-tts
  - protobufjs
  - sharp
  - simple-git-hooks
  - utf-8-validate

overrides:
  "@electron/node-gyp": 10.2.0-electron.2
  "@floating-ui/core": 1.7.2
  "@floating-ui/dom": 1.7.2
  "@floating-ui/react": 0.27.14
  "@floating-ui/react-dom": 2.1.4
  "@types/react": 19.1.17
  drizzle-orm: 0.45.1
  global-agent>serialize-error: 7.0.1
  is-core-module: npm:@nolyfill/is-core-module@1.0.39
  isarray: npm:@nolyfill/isarray@1.0.44
  # @electron/rebuild 3.7.2 自带的 node-abi 停在 3.87，不认识 Electron 43，
  # 原生模块重编会报 "Could not detect abi for version 43"。3.96 仍是同一大版本。
  node-abi: 3.96.0
  # extract-zip 仍要 yauzl ^2，而 yauzl 2.10 依赖的 fd-slicer 在 Node 26 下
  # 不再产生数据：openReadStream 给出的流既无 data 也无 end，事件循环排空后
  # 进程直接以 0 退出，forge 的打包就停在解压 Electron 包那一步。yauzl 3 弃用了
  # fd-slicer，extract-zip 对它的用法不变。
  yauzl: 3.4.0
  react: 19.1.0
  react-dom: 19.1.0
  serialize-error: 2.1.0

patchedDependencies:
  "@microflash/remark-callout-directives": patches/@microflash__remark-callout-directives.patch
  "@mozilla/readability@0.6.0": patches/@mozilla__readability@0.6.0.patch
  "@pengx17/electron-forge-maker-appimage": patches/@pengx17__electron-forge-maker-appimage.patch
  re-resizable@6.11.2: patches/re-resizable@6.11.2.patch
  workbox-precaching: patches/workbox-precaching.patch
